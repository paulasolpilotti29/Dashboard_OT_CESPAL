<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard OT CESPAL</title>

<style>

body{
    margin:0;
    font-family:Segoe UI,Arial,sans-serif;
    background:#eef3f8;
}

.header{
    background:#0f4c81;
    color:white;
    padding:20px;
}

.header h1{
    margin:0;
}

.container{
    padding:20px;
}

.kpis{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.kpi{
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.kpi h3{
    margin:0;
    color:#666;
}

.kpi span{
    font-size:34px;
    font-weight:bold;
    color:#0f4c81;
}

</style>

</head>

<body>

<div class="header">
    <h1>⚡ Dashboard OT Mauricio Ferace</h1>
</div>

<div class="container">

<div class="kpis">

<div class="kpi">
<h3>Total OT</h3>
<span id="totalOT">-</span>
</div>

<div class="kpi">
<h3>Clientes</h3>
<span id="clientes">-</span>
</div>

<div class="kpi">
<h3>Calles</h3>
<span id="calles">-</span>
</div>

<div class="kpi">
<h3>Promedio días</h3>
<span id="dias">-</span>
</div>

</div>

</div>

<script>

fetch("datos.csv")
.then(r => r.text())
.then(data => {

    const filas =
        data.split("\n");

    document.getElementById("totalOT")
        .innerText = filas.length - 1;

});

</script>

</body>
</html>
