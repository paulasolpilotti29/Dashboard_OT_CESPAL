<script>

fetch("datos.csv")
.then(r => r.text())
.then(csv => {

    let lineas = csv.split(/\r?\n/);

    // quitar líneas vacías
    lineas = lineas.filter(l =>
        l.trim() !== "" &&
        l !== ";;;;;;;;;;"
    );

    // encabezado
    const encabezado =
        lineas[0].split(";");

    // registros válidos
    const registros =
        lineas.filter(l => {

            const primerCampo =
                l.split(";")[0]?.trim();

            return /^\d+$/.test(primerCampo);

        });

    document.getElementById("totalOT")
        .innerText = registros.length;

    const clientes = new Set();
    const calles = new Set();

    registros.forEach(r => {

        const c = r.split(";");

        // Titular
        clientes.add(c[4]);

        // Calle
        let domicilio = c[5] || "";

        let calle =
            domicilio.split(" CP:")[0]
            .trim();

        calles.add(calle);

    });

    document.getElementById("clientes")
        .innerText = clientes.size;

    document.getElementById("calles")
        .innerText = calles.size;

});

</script>
